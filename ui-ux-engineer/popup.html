<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Tab Organizer - Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    /* Reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #121212;
      color: #eee;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      height: 100vh;
      padding: 20px;
    }

    /* Container */
    .popup-dashboard {
      width: 360px;
      background: linear-gradient(135deg, #2a2a72, #009ffd);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 159, 253, 0.4);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-weight: 700;
      font-size: 1.4rem;
      letter-spacing: 1px;
      color: #fff;
      user-select: none;
    }

    .top-actions {
      display: flex;
      gap: 16px;
    }

    .icon-button {
      background: transparent;
      border: none;
      color: #cce7ff;
      cursor: pointer;
      font-size: 1.3rem;
      transition: color 0.2s ease;
    }

    .icon-button:hover {
      color: #fff;
    }

    /* Active Groups Section */
    .groups-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .group-card {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      user-select: none;
      transition: background 0.3s ease;
    }

    .group-card:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .group-name {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .group-icon {
      font-size: 1.2rem;
    }

    .tab-count {
      background: #00ffd8;
      color: #003c3c;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 2px 8px;
      border-radius: 9999px;
    }

    /* Suggested Actions */
    .suggestions-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .suggestion-pill {
      background: rgba(0, 255, 255, 0.15);
      padding: 8px 14px;
      border-radius: 9999px;
      font-weight: 500;
      font-size: 0.9rem;
      color: #b3ffff;
      cursor: pointer;
      transition: background 0.3s ease;
      user-select: none;
    }

    .suggestion-pill:hover {
      background: rgba(0, 255, 255, 0.35);
      color: #00ffd8;
    }

    /* AI Chat Assistant */
    .chat-assistant {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 20px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.95rem;
      color: #b3ffff;
    }

    .chat-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #e0ffff;
      font-size: 1rem;
      font-weight: 500;
      caret-color: #00ffd8;
    }

    .chat-send-btn {
      background: #00ffd8;
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #003c3c;
      font-weight: 700;
      transition: background 0.2s ease;
    }

    .chat-send-btn:hover {
      background: #00cca8;
    }

  </style>
</head>
<body>

  <div class="popup-dashboard">

    <!-- Top Bar -->
    <div class="top-bar">
      <div class="logo">AI Tab Organizer</div>
      <div class="top-actions">
        <button class="icon-button" title="Search Tabs" aria-label="Search Tabs">🔍</button>
        <button class="icon-button" title="Settings" aria-label="Settings">⚙️</button>
      </div>
    </div>

    <!-- Active Groups -->
    <div class="groups-section" aria-label="Active tab groups">

      <div class="group-card" tabindex="0">
        <div class="group-name">📂 Coding</div>
        <div class="tab-count">5 tabs</div>
      </div>

      <div class="group-card" tabindex="0">
        <div class="group-name">📚 Research</div>
        <div class="tab-count">7 tabs</div>
      </div>

      <div class="group-card" tabindex="0">
        <div class="group-name">📝 Writing</div>
        <div class="tab-count">3 tabs</div>
      </div>

    </div>

    <!-- Suggested Actions -->
    <div class="suggestions-section" aria-label="AI Recommended actions">

      <div class="suggestion-pill" tabindex="0">Close 4 inactive tabs?</div>
      <div class="suggestion-pill" tabindex="0">Move Research group to Profile 2?</div>

    </div>

    <!-- AI Chat Assistant -->
    <form class="chat-assistant" role="search" aria-label="AI chat assistant" onsubmit="return handleChat(event)">
      <input
        type="text"
        placeholder="Ask AI..."
        class="chat-input"
        id="chatInput"
        autocomplete="off"
        aria-describedby="chatHelp"
        required
      />
      <button type="submit" class="chat-send-btn" title="Send">→</button>
    </form>

  </div>

  <script>
    function handleChat(event) {
      event.preventDefault();
      const input = document.getElementById('chatInput');
      const query = input.value.trim();

      if (!query) return;

      // Simple confirmation mock
      alert(`AI received: "${query}"\n\n(Here you'd trigger the AI response + action button)`);

      input.value = '';
    }
  </script>

</body>
</html>
